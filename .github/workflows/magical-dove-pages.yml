# 매지컬 비둘기 스토어 페이지 검사 (README의 '매지컬 비둘기 스토어 페이지').
# 남은 자리표시, 다시 만들지 않은 페이지, 본문의 끊긴 링크, 형식이 틀린 공지 파일이 있으면 실패한다.
# 배포 방식(main 브랜치에서 GitHub Pages)은 바꾸지 않는다.
name: Magical Dove pages

on:
  pull_request:
    paths:
      - '_magical-dove/**'
      - 'MagicalDove/**'
      - '.github/workflows/magical-dove-pages.yml'
  push:
    branches: [main]
    paths:
      - '_magical-dove/**'
      - 'MagicalDove/**'
      - '.github/workflows/magical-dove-pages.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node _magical-dove/pages.mjs check
