<main id="top">
  <section class="hero" id="hero" aria-label="NewMeans">
    <div class="copy">
      <h1 class="headline display">Life, a little more<br><span class="nowrap"><span class="slot" id="slot"><span class="reel" id="reel"><span class="word"><span class="w">joyful</span><span class="dot">.</span></span></span></span><button type="button" class="lever" id="lever" data-i18n="home.lever" data-i18n-attr="aria-label" aria-label="단어 다시 뽑기"><svg viewBox="0 0 46 96" aria-hidden="true"><ellipse cx="23" cy="86" rx="16" ry="7" fill="#3B3732"/><rect x="17" y="74" width="12" height="12" rx="4" fill="#706B64"/><rect class="stick" x="20" y="14" width="6" height="64" rx="3" fill="#3B3732"/><circle class="knob" cx="23" cy="14" r="12" fill="var(--word)"/></svg></button><span class="tier" id="tier" hidden></span></span></h1>

    </div>
    <div class="brandwrap">
      <div class="acc acc--back" id="acc-back" aria-hidden="true"></div>
      <div class="brandart" id="brandart" data-nm-hero data-acc="acc" data-back="acc-back" data-pts="pts" role="img" aria-label="NewMeans"></div>

      <div class="pts" id="pts" aria-hidden="true"></div>
    </div>

    <p class="sr" id="hero-status" role="status" aria-live="polite"></p>
    <div class="bottom">
      <div class="corner corner--left"><span>Seoul, Korea</span><button type="button" class="wordsbtn" id="words-btn" aria-haspopup="dialog" aria-controls="words"></button></div>

    </div>

  <!-- Typer: a pinned scene. Logo, two tags, a wordless stage, two buttons. scenes.js drives it with scroll. -->
  <section class="scene scene--typer" id="works" data-scene="typer" aria-label="Typer">
    <div class="scene__pin"><div class="wrap scene__in">
      <div class="scene__head">
        <a class="scene__logo" href="typer.html"><img src="assets/brand/typer-logo.png" alt="Typer"></a>
        <div class="tags"><span class="tag" data-i18n="tag.game">Game</span><span class="tag" data-i18n="tag.mobile">Mobile</span></div>
      </div>
      <div class="stage stage--typer" role="img" data-i18n="scene.typer" data-i18n-attr="aria-label" aria-label="공이 키캡을 튀며 Typer를 친다">
        <div class="band band--top"><i class="hole hole--top"></i></div>
        <div class="cap" style="--x:100"><b></b></div>
        <div class="cap" style="--x:240"><b></b></div>
        <div class="cap" style="--x:380"><b></b></div>
        <div class="cap" style="--x:520"><b></b></div>
        <div class="cap" style="--x:660"><b></b></div>
        <div class="shards"><i></i><i></i><i></i><i></i></div>
        <img class="ball" src="assets/shop/ball/0000_0.png" alt="" draggable="false">
        <div class="band band--bottom"><i class="hole hole--bottom"></i></div>
      </div>
      <div class="scene__act">
        <a class="btn btn--primary btn--lg" href="typer.html" data-i18n="cta.more">자세히 보기</a>
        <a class="btn btn--tint btn--lg" href="typer.html#get" data-i18n="cta.download">다운로드</a>
        <button type="button" class="btn btn--icon replay" data-i18n="cta.replay" data-i18n-attr="aria-label" aria-label="다시 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      </div>
    </div></div>
  </section>

  <!-- Dopamine University: two wordless cards. A sparkle bounces over messages, a report writes itself. -->
  <section class="scene scene--dopa" id="dopa" data-scene="dopa" aria-label="Dopamine University">
    <div class="wrap scene__in">
      <div class="scene__head">
        <a class="scene__logo scene__logo--dopa" href="dopamine.html"><img src="assets/brand/dopamine-logo.png" alt="Dopamine University"></a>
        <div class="tags"><span class="tag" data-i18n="tag.aitest">AI 심리테스트</span><span class="tag" data-i18n="tag.web">Web</span></div>
      </div>
      <div class="cards" data-dopa-cards role="img" data-i18n="scene.dopa" data-i18n-attr="aria-label" aria-label="메시지가 읽히고 보고서가 써진다">
        <div class="card card--chat">
          <span class="bar" style="--w:62%"><i></i></span>
          <span class="bar" style="--w:40%"><i></i></span>
          <span class="bar" style="--w:74%"><i></i></span>
          <span class="bar" style="--w:48%"><i></i></span>
          <span class="bar" style="--w:56%"><i></i></span>
          <svg class="bean" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg>
        </div>
        <div class="card card--report">
          <i class="ln ln--title"></i>
          <i class="ln" style="--w:92%"></i><i class="ln" style="--w:66%"></i><i class="ln" style="--w:84%"></i><i class="ln" style="--w:48%"></i>
          <div class="axis"><b class="dot dot--a"></b><i class="track"><b class="needle"></b></i><b class="dot dot--b"></b></div>
          <div class="stamp"><svg class="sparkle" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z"/></svg></div>
        </div>
      </div>
      <div class="scene__act">
        <a class="btn btn--primary btn--lg" href="dopamine.html" data-i18n="cta.more">자세히 보기</a>
        <a class="btn btn--tint btn--lg" href="https://dodae.me/" target="_blank" rel="noopener noreferrer" data-i18n="cta.start">테스트 시작하기</a>
      </div>
    </div>
  </section>
