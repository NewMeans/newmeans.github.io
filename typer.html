<body class="tp">

  <header class="nav nav--wide">
    <div class="wrap nav__in">
      <a class="nav__brand" href="index.html" aria-label="NewMeans home"><img class="nav__logo" src="assets/brand/newmeans-wordmark-ink.png" alt="NewMeans"></a>
      <span class="nav__here">Typer</span>
      <div class="nav__spacer"></div>
      <div class="nav__tools">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang-set="ko">KO</button><span>·</span><button type="button" data-lang-set="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <main id="main" class="one">
    <header class="one__head">
      <h1><img src="assets/brand/typer-logo.png" alt="Typer"></h1>
      <p class="line" data-i18n="typer.tagline">키캡을 부수는
손맛과 타건음</p>
      <div class="actions badges">
        <a href="https://apps.apple.com/kr/app/typer-asmr-keyboard-smash/id6753107938" target="_blank" rel="noopener noreferrer"><img data-store="app-store" src="assets/badges/app-store-ko.svg" alt="App Store에서 다운로드"></a>
        <a href="https://play.google.com/store/apps/details?id=com.NewMeans.Typer" target="_blank" rel="noopener noreferrer"><img data-store="google-play" src="assets/badges/google-play-ko.svg" alt="Google Play에서 다운로드"></a>
      </div>
    </header>

    <!-- the game itself: drag to aim, release to fire, keys fire too, every hit plays the switch -->
    <section class="one__block play" data-typer-play aria-label="Play">
      <div class="play__screen"><div data-typer-board></div></div>
      <div class="switches" data-switches role="group" data-i18n="typer.custom.switch" data-i18n-attr="aria-label" aria-label="스위치"></div>
      <p class="play__status" data-play-status role="status"></p>
    </section>

    <p class="one__note" data-i18n="typer.kit">스위치 7종 · 키캡 8종 · 프레임 8종 · 모니터 4종</p>

    <section class="one__block" aria-label="Screens">
      <div class="shots">
        <figure data-tilt><img src="assets/screens/typer/IMG_7203.PNG" width="1170" height="2532" alt="Typer: keycap break effects" loading="lazy"></figure>
        <figure data-tilt><img src="assets/screens/typer/IMG_7204.PNG" width="1170" height="2532" alt="Typer: gameplay" loading="lazy"></figure>
        <figure data-tilt><img src="assets/screens/typer/IMG_3497.PNG" width="1170" height="2532" alt="Typer: desk customization" loading="lazy"></figure>
      </div>
    </section>

    <section class="one__nums" aria-label="Typer in numbers">
      <div><b>30,000+</b><span data-i18n="typer.num.dl">다운로드</span></div>
      <div><b>4.74★</b><span data-i18n="typer.num.rating">평균 평점</span></div>
      <div><b>177</b><span data-i18n="typer.num.countries">출시 국가</span></div>
    </section>
