  <header class="nav nav--wide">

  <main id="main" class="one">
    <header class="one__head">
      <h1><img src="assets/brand/dopamine-logo.png" alt="Dopamine University"></h1>
      <p class="line" data-i18n="home.dopa.hint">내 카톡으로 보는 나의 다른 모습</p>
      <div class="actions">
        <a class="btn btn--solid" href="https://dodae.me/" target="_blank" rel="noopener noreferrer"><span data-i18n="dopa.cta">테스트 시작하기</span><span class="arw" aria-hidden="true">→</span></a>
      </div>
    </header>

    <!-- the report: it leans toward the cursor and the needle follows it -->
    <section class="one__block" aria-label="Report">
      <div class="report is-done" data-report>
        <div class="report__head"><img src="assets/brand/dopamine-symbol.png" alt=""><span data-i18n="dopa.report">연구 보고서</span><em>dodae.me</em></div>
        <div class="report__lines"><i style="--w:92%;--d:.3"></i><i style="--w:66%;--d:.36"></i><i style="--w:84%;--d:.42"></i><i style="--w:48%;--d:.48"></i><i style="--w:74%;--d:.54"></i></div>
        <div class="report__axis"><span data-i18n="dopa.teto">테토</span><i class="report__track"><b class="report__needle"></b></i><span data-i18n="dopa.egen">에겐</span></div>
        <div class="report__stamp"><img src="assets/brand/dopamine-symbol.png" alt=""></div>
      </div>
      <p class="one__note" data-i18n="dopa.flow">카톡 대화 하나 → AI 연구 보고서</p>
    </section>

    <section class="one__block" aria-label="Tests">
      <div class="covers">
        <a class="cover" data-tilt href="https://dodae.me/analyze/egen-teto" target="_blank" rel="noopener noreferrer">
          <img src="assets/screens/dopamine/egen-teto.jpg" alt="" loading="lazy">
          <span class="cover__name"><span data-i18n="dopa.test2.title">AI 에겐 테토 테스트</span><span class="arw" aria-hidden="true">↗</span></span>
        </a>
        <a class="cover" data-tilt href="https://dodae.me/t/devil-hunter/landing" target="_blank" rel="noopener noreferrer">
          <img src="assets/screens/dopamine/devil-hunter.webp" alt="" loading="lazy">
          <span class="cover__name"><span data-i18n="dopa.test1.title">AI 캠퍼스 리크루팅 테스트</span><span class="arw" aria-hidden="true">↗</span></span>
        </a>
      </div>
    </section>

    <section class="one__block" aria-label="No fixed types">
      <p class="one__note"><b data-i18n="dopa.unique.title">정해진 유형 없음</b> · <span data-i18n="dopa.unique.short">2,000명이 하면 2,000개의 결과</span></p>
